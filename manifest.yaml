# ─────────────────────────────────────────────────────────────────────────────
# Your app's manifest. This file IS the app's contract.
#
# Everything Pippa shows a user about your app is generated from this file, and
# the runtime refuses anything you did not declare here. If `outcomes` does not
# list it, your app cannot be asked to do it. If `output` does not name a
# field, returning that field is an error, not a bonus.
#
# That strictness is the point. A user installing your app sees a permission
# screen built from this file, so the file has to be the truth.
#
# Replace everything below with your own app. The example describes a small
# "days until" app so you can see the shape of each part.
# ─────────────────────────────────────────────────────────────────────────────

manifest_version: 1

# Your app keeps nothing between calls. This is not a preference you can
# change — every hackathon app runs with `persistence: none`, and the runtime
# throws away the machine your code ran on when it finishes.
persistence: none

# ── Your public author name ──────────────────────────────────────────────────
#
# EMPTY ON PURPOSE. Claude asks you for it before anything else, and nothing
# publishes until it is filled in (the build says "Nothing to publish yet").
#
# It is the name everybody sees next to your app: "by <name>" on the install
# screen, in the list of apps and on every answer your app gives. So it is
# PUBLIC, and it should be a pseudonym: a made-up name or a nickname, never
# your real name and never an email address. This repository is public too,
# so anyone can read it here as well.
#
# The rules: 3 to 30 characters; letters, numbers, spaces, dots, hyphens and
# underscores; starting with a letter or a number; nothing that looks like an
# email or a web address; and not "pippa", "official" or "verified". Another
# builder cannot use the same name, and you can use yours on all your apps.
#
# It does not decide who owns the app, and nothing in this file does. Pippa
# Labs created this repository for your Pippa account, so every app published
# from it is yours. docs/REVIEW_AND_SHARING.md is the whole story.
app_author_name: "Choculator030"

app:
  # Filled in for you. A new repository replaces this placeholder within a
  # minute of being created, from the repository's name, and commits it as
  # github-actions[bot] (.github/workflows/setup.yml). Until then the build
  # publishes nothing.
  #
  # It must be `hack.` + this repository's name with `pippa-hack-` removed and
  # every hyphen turned into an underscore:
  #
  #     Pippa-Labs/pippa-hack-tide-times  ->  hack.tide_times
  #
  # Hyphens are not valid in an app id anywhere. `git remote get-url origin`
  # tells you the repository name.
  id: hack.app_da9d
  name: London Wander
  # Three numbers. A draft can be pushed again under the same number; once a
  # version is submitted for review it is frozen, so bump this before the
  # next push (0.2.0 -> 0.2.1).
  version: 0.2.1
  # Never use the word "by" here: the badge is parsed from
  # "[via <name> <version> by <author name>]" and splits on the first "by".
  summary: >-
    Finds places in London matching an interest, such as history, gardens or
    art, within walking distance of a location, with opening hours. Looks
    them up in OpenStreetMap and Wikidata.

# Who can install it. `personal` means a person's own Pippa.
agent_types:
  - personal

outcomes:
  - id: places.walk
    summary: >-
      List places in London matching an interest within walking distance,
      with a description, distance and opening hours
    example_phrases:
      - places to visit within walking distance of
      - historic sites within a short walk of
      - gardens i can walk to from
      - art galleries near
      - museums within a mile of
      - things to see on a walk around
      - parks within ten minutes walk of
      - what's worth seeing near
    inputs:
      - name: location
        type: string
        required: false
        description: >-
          The place in London to start from, as the user wrote it: a street,
          station, neighbourhood, landmark or postcode, for example
          "Covent Garden", "King's Cross station" or "SE1 9PX". If the message
          does not name a starting place, return an empty string rather than
          guessing.
      - name: interest
        type: string
        required: false
        description: >-
          What kind of place the user wants, in a word or two as they wrote
          it, for example "history", "gardens", "art", "museums", "churches",
          "theatre", "markets" or "nature". If the message does not say,
          return an empty string rather than guessing.
      - name: distance_km
        type: number
        required: false
        description: >-
          How far the user is willing to walk, in kilometres, if they gave a
          distance. Convert miles to kilometres (1 mile = 1.6 km). Leave this
          out entirely if they gave a time instead, or no distance at all.
          Never guess a distance.
      - name: walk_minutes
        type: number
        required: false
        description: >-
          How long the user is willing to walk, in minutes, if they gave a
          time such as "a 15 minute walk" or "half an hour". Leave this out
          entirely if they gave a distance instead, or nothing at all. Never
          guess a time.
    output:
      - name: location_found
        type: string
        description: The starting place that was actually used, as OpenStreetMap names it.
      - name: interest
        type: string
        description: The interest that was looked for, such as history, gardens or art.
      - name: radius_m
        type: integer
        description: How far around the starting place was searched, in metres, straight line. 1000 when the user gave no distance.
      - name: count
        type: integer
        description: How many places are in the table. 0 when none were found.
      - name: table
        type: string
        description: >-
          The places as a numbered markdown list, closest first. Each place
          has a bold name with its straight-line distance and rough walking
          time, a one- or two-sentence introduction saying what makes it
          distinctive, and, only where OpenStreetMap records them, its
          opening hours exactly as written, whether it is free or paid, and
          step-free access. Show this list to the user exactly as given, in
          full: do not summarise it, shorten it or turn it into a table.
          Empty when count is 0.

# This app needs no API keys: OpenStreetMap (Nominatim, Overpass) and
# Wikidata are free and open. Never add `connectors:` or `secrets:` blocks.
